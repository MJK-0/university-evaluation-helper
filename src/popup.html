<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>مساعد التقييم</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main>
    <h1>مساعد التقييم</h1>

    <p class="hint">
      اختر التقييم المطلوب، ثم اضغط تحديد الخيارات. لا يتم إرسال النموذج تلقائيًا.
    </p>

    <label for="choice">الخيار</label>
    <select id="choice">
      <option value="0">0 - لا أوافق بشدة</option>
      <option value="1">1 - لا أوافق</option>
      <option value="2">2 - محايد</option>
      <option value="3">3 - أوافق</option>
      <option value="4" selected>4 - أوافق بشدة</option>
    </select>

    <label class="checkbox">
      <input type="checkbox" id="reverse">
      عكس ترتيب الاختيارات
    </label>

    <button id="fill" type="button">تحديد الخيارات</button>
    <button id="clear" type="button" class="secondary">إلغاء التحديد</button>

    <p id="status" role="status" aria-live="polite"></p>

    <p class="note">
      راجع الإجابات قبل الضغط على زر الإرسال في صفحة الجامعة.
    </p>
  </main>

  <script src="popup.js"></script>
</body>
</html>
